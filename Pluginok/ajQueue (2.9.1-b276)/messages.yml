        base: '&7A sorban a &f{POS}&7. helyen állsz a &f{LEN}&7.-ből/-ből. Becsült idő: {TIME}'
    left-last-queue: '&aKiléptél az utolsó sorból, amelyben voltál.'
    now-in-queue: |-
        &aMostantól{EXPRESS}&asorban állsz a {SERVER} szerverre! &7A sorban a &f{POS}&7. helyen állsz a &f{LEN}&7.-ből/-ből.
        &7Írd be a &f/leavequeue&7 parancsot vagy &7<click:run_command:/leavequeue {SERVERNAME}>kattints ide</click>&7 a sorból való kilépéshez!
    now-in-empty-queue: ''
    express: ' &6express '
    non-express: ' '
    sending-now: '&aÉppen átküldelek a &f{SERVER} &aszerverre..'
    making-room: <gold>Helyet csinálok számodra..
    priority-increased: <gold>Mostantól magasabb prioritásod van! <green>Előrébb kerülsz a sorban..
    skipping-queue-server: ''
errors:
    server-not-exist: '&cA {SERVER} szerver nem létezik!'
    already-queued: '&cMár sorban állsz arra a szerverre!'
    player-only: '&cEzt a parancsot csak játékosként hajthatod végre!'
    already-connected: '&cMár csatlakozva vagy ehhez a szerverhez!'
    cant-join-paused: '&cNem csatlakozhatsz a {SERVER} sorához, mert szüneteltetve van.'
    deny-joining-from-server: '&cErről a szerverről nem csatlakozhatsz sorokhoz!'

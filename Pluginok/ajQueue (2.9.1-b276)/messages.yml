        base: <red>A {VERSIONS} verzióval kell rendelkezned a szerverre való csatlakozáshoz!
        or: ' vagy '
        comma: ', '
        title: <red><bold>Rossz verzió
        subtitle: <gold>Kérlek, csatlakozz a következővel: <yellow>{VERSIONS}<gold>.
    too-fast-queue: <red>Túl gyorsan sorba állsz!
    kicked-to-make-room: <red>Átkerültél a lobbyba, hogy helyet csináljunk egy másik játékosnak.
    make-room-failed:
        player: <red>Nem sikerült helyet csinálni számodra azon a szerveren.
        admin: <red>Nem sikerült helyet csinálni számodra azon a szerveren. További információkért nézd meg a konzolt.
commands:
    leave-queue: '&aKiléptél a {SERVER} sorából!'
    reload: '&aKonfiguráció és üzenetek sikeresen újratöltve!'
    joinqueue:
        usage: '&cHasználat: /joinqueue <szerver>'
    kick:
        usage: '<red>Használat: /ajqueue kick <játékos> [sor]'
        no-player: '&cNem található {PLAYER}! Győződj meg róla, hogy sorban áll!'
        unknown-server: '&cNem található a {QUEUE} sor. Győződj meg róla, hogy helyesen írtad be!'
        success: <green>Kirúgtad <white>{PLAYER} <green>-t {NUM} sor{ból/ből}!
    kickall:
        usage: '<red>Használat: /ajqueue kickall <sor>'
        success: <green>Kirúgtál <white>{NUM} <green>játékost a <white>{SERVER}<green> sorból!
    pausequeueserver:
        unpaused: <green>Már nem vagy szüneteltetve! <gray>Mostantól normálisan használhatod a soros szervereket.
        paused: <green>Mostantól szüneteltetve vagy! <gray>Többé nem küldünk át soros szervereken keresztül.
        reminder: '<gold>Emlékeztető: <yellow>Jelenleg szüneteltetve vagy a soros szerverek számára, így nem fognak rajtuk keresztül átküldeni!<gray> Használd a <white>/ajQueue pausequeueserver</white> parancsot a szüneteltetés feloldásához és a normál viselkedés visszaállításához'
    leave:
        more-args: '&cKérlek, add meg, melyik sorból szeretnél kilépni! &7Ezekben a sorokban állsz: {QUEUES}'
        queues-list-format: '&f{NAME}&7, '
        not-queued: '&cNem állsz sorban arra a szerverre! &7Ezekben a sorokban állsz: {QUEUES}'
        no-queues: '&cNem állsz sorban!'
    pause:
        more-args: '&cHasználat: /ajqueue pause <szerver> [be/ki]'
        no-server: '&cAz a szerver nem létezik!'
        success: '&aA {SERVER} sora mostantól {PAUSED}'
        paused:
            'true': '&eszüneteltetve'
            'false': '&aaktív'
    send:
        player-not-found: '&cA játékos nem található. Győződj meg róla, hogy online van!'
        usage: '<red>Használat: /ajqueue send <játékos> <szerver>'
    listqueues:
        header: '&9Sorok:'
        single-format: '<hover:show_text:''&7Állapot: {STATUS}''>{COLOR}{NAME}&7: {COUNT} sorban</hover>'
        both-format: '<hover:show_text:''&7Állapot: {STATUS}''>{COLOR}{NAME}&7: {STANDARD_COUNT}+&6{EXPRESS_COUNT} &7sorban</hover>'
noperm: '&cNincs jogosultságod ehhez!'

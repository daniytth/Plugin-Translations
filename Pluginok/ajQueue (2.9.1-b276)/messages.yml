        restarting: újraindul
        restricted: korlátozott
        paused: szüneteltetve
        whitelisted: fehérlistázott
    full:
        base: '&c{SERVER} megtelt. &7A sorban a &f{POS}&7. helyen állsz a &f{LEN}&7.-ből/-ből. Becsült idő: {TIME}'
